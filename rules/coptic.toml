# The Coptic hyphenation rules, as data.
#
# Everything else in this repository reads this file: the reference
# implementation (coptic_hyphenation/reference.py) and, later, the generator of
# the TeX pattern file. Change the rules here, never in the generated output.
# SPEC.md explains each rule and why it exists.
#
# Version 0 was the set of rules this work started from. Version 1, in
# progress, rebuilds the onset list and adds the rules decided since.
#
# Terms used below:
#   letter  a character of the Coptic alphabet
#   mark    a combining mark (Unicode category Mn): jinkim U+0300, trema U+0308,
#           the overline U+FE26/U+0305, ...
#   unit    one letter plus the marks written after it: ⲛ̀ is one unit
# Comparisons ignore case: a capital behaves like its small letter.

[meta]
version = "1-draft"
dialect = "Bohairic"

[letters]
# A unit whose letter is one of these is a vowel. Every other letter is a
# consonant, including ϯ.
vowels = ["ⲁ", "ⲉ", "ⲏ", "ⲓ", "ⲟ", "ⲩ", "ⲱ"]
# Consonants that carry their own vowel (ϯ is "ti"), so a piece holding one is
# never a lone consonant (see [lone_consonants]).
carry_a_vowel = ["ϯ"]

[syllabic]
# Units that are a syllable by themselves. The jinkim (U+0300) marks one: on ⲙ
# and ⲛ a syllabic sonorant (ⲙ̀-ⲫⲣⲏϯ, ⲛ̀-ⲥⲏⲟⲩ), on ⲉ a vowel standing alone
# (ⲉ̀-ⲡϣⲱⲓ, ⲉ̀-ⲃⲟⲗ, ⲁϥ-ⲉ̀ⲙⲓ), on ϣ a consonant with the vowel before it
# (ⲁϥ-ϣ̀-ⲧⲉⲙ-ϫⲓⲙⲓ). ⲉ̀ and ϣ̀ added 2026-11-20. A break may fall on either side
# of one, even when that leaves one unit before the break. Whether the jinkim
# on other letters (ⲓ̀, ⲁ̀, ⲡ̀ ...) does the same is still open.
units = ["ⲙ̀", "ⲛ̀", "ⲉ̀", "ϣ̀"]

# Prefixes that detach when a word begins with one. Only the longest match
# counts, and no break from the onset rule falls inside it: ⲡⲉⲛ-ⲓⲱⲧ, never
# ⲡⲉ-ⲛⲓⲱⲧ. A break after a prefix may leave one unit before it (ϯ-ⲡⲁⲣ-ⲑⲉ-ⲛⲟⲥ).
# A prefix with "followed_by" detaches only when the units after it match, one
# slot per unit: a list of letters, or "consonant" or "vowel".
[[prefix]]
text = "ⲡⲓ"
meaning = "definite article, masculine singular"

[[prefix]]
text = "ϯ"
meaning = "definite article, feminine singular"

[[prefix]]
text = "ⲛⲓ"
meaning = "definite article, plural"

[[prefix]]
text = "ⲟⲩ"
meaning = "indefinite article, singular"

[[prefix]]
text = "ϩⲁⲛ"
meaning = "indefinite article, plural"

[[prefix]]
text = "ⲫⲏ"
meaning = "relative, masculine singular (he who)"

[[prefix]]
text = "ⲛⲏ"
meaning = "relative, plural (those who)"

[[prefix]]
text = "ⲉ"
meaning = "the preposition ⲉ written without its jinkim, before the article ⲡ or ⲫ"
followed_by = [["ⲡ", "ⲫ"], "consonant"]
why = """
ⲉⲡϣⲱⲓ is ⲉ + ⲡϣⲱⲓ, so it breaks ⲉ-ⲡϣⲱⲓ, as ⲉ̀ⲡϣⲱⲓ does through its jinkim
(decided 2026-11-20). Not before ⲧ or ⲑ: an unmarked ⲉⲧ- or ⲉⲑ- before a
consonant is nearly always the relative or ⲉⲑⲃⲉ (ⲉⲑⲛⲏⲟⲩ, ⲉⲧϣⲉ)."""

[[prefix]]
text = "ⲡⲉⲛ"
meaning = "possessive article, our (masculine)"

[[prefix]]
text = "ⲧⲉⲛ"
meaning = "possessive article, our (feminine)"

[[prefix]]
text = "ⲛⲉⲛ"
meaning = "possessive article, our (plural)"

# One-letter articles. When the consonants after a word-initial syllabic unit
# or prefix begin with one of these, they all go with the next syllable: the
# article stays with its noun (ⲙ̀-ⲫⲛⲟⲩϯ, ⲙ̀-ⲡϭⲟⲓⲥ, ⲉ̀-ⲡϣⲱⲓ), and the onset rule
# makes no break among them (ⲛ̀-ϯⲙⲉⲑ-ⲙⲏⲓ). Decided 2026-11-20, ϯ included
# although it carries its own vowel.
[articles]
letters = ["ⲡ", "ⲫ", "ⲧ", "ⲑ", "ϯ"]

# A consonant that is a morpheme by itself: how it is divided (D1). The names
# are Coptic SCRIPTORIUM's parts of speech. Articles are carried out by [articles]; a
# subject pronoun needs nothing, because a pair the onset list does not hold
# already splits after it (ⲁϥ-ⲧⲱⲛϥ). Decided 2026-11-20.
[lone_letters]
"article" = "with what follows"
"subject pronoun" = "with what precedes"

# Pairs of consonants that stay together. Where two or more consonants stand
# between two vowels, the next syllable takes the last two if they are listed
# here, otherwise only the last one: ⲡⲓ-ⲭⲣⲓ-ⲥⲧⲟⲥ, ⲁⲗ-ⲗⲏ-ⲗⲟⲩⲓⲁ. A consonant
# carrying a mark is never part of a listed pair.
#
# The list was started from nothing on 2026-11-20. A pair is listed only when
# it has been decided (status "decided"), or when a case pinned in
# tests/cases.txt needs it (status "pinned", still to be confirmed).

[[onsets]]
pair = "ⲭⲣ"
status = "pinned"
case = "ⲡⲓ-ⲭⲣⲓ-ⲥⲧⲟⲥ"
why = "ⲭ is one sound (kh) and takes a liquid as ⲕ does."

[[onsets]]
pair = "ⲥⲧ"
status = "pinned"
case = "ⲡⲓ-ⲭⲣⲓ-ⲥⲧⲟⲥ"

[[onsets]]
pair = "ⲡⲛ"
status = "pinned"
case = "ⲡⲓ-ⲡⲛⲉⲩⲙⲁ"

[[onsets]]
pair = "ϣⲧ"
status = "pinned"
case = "ⲧⲉ-ⲧⲉⲛ-ϣⲧⲉ-ⲙⲉⲣ-ⲥⲕⲁⲛ-ⲇⲁ-ⲗⲓ-ⲍⲉⲥⲑⲉ"
why = "ϣⲧⲉⲙ- is the negative infinitive prefix, so ϣⲧ opens words."

[[onsets]]
pair = "ⲥⲕ"
status = "pinned"
case = "ⲧⲉ-ⲧⲉⲛ-ϣⲧⲉ-ⲙⲉⲣ-ⲥⲕⲁⲛ-ⲇⲁ-ⲗⲓ-ⲍⲉⲥⲑⲉ"

[[onsets]]
pair = "ⲫⲣ"
status = "pinned"
case = "ⲙ̀-ⲫⲣⲏϯ"
why = "Keeps the article ⲫ with its noun ⲣⲏϯ."

# No piece between two breaks may be left without a vowel: a vowel, a
# syllabic unit, or a letter that carries one (decided 2026-11-20). When the
# other rules would leave consonants alone, a break is dropped: they join what
# follows when they come after a prefix or a syllabic unit, since that is the
# start of a stem (ⲡⲓ-ϣⲗⲟⲗ, ⲛ̀-ⲕⲣⲓ-ⲧⲏⲥ), and otherwise what precedes, since that
# is the end of a word part such as a pronoun (ⲡⲉϥ-ⲙ̀-ⲃⲟⲛ, ⲉⲣⲉ-ⲧⲉⲛ-ⲉ̀-ϣⲱⲧ). At
# the start or the end of a word they join the only side there is.
[lone_consonants]
allowed = false

[minimums]
# Counted in units, not code points: ⲛ̀ counts as one.
# Units before a break made by the onset rule.
before = 2
# Units before a break next to a syllabic unit or after a prefix.
before_syllable = 1
# Units after any break.
after = 3
