# The Coptic hyphenation rules, as data.
#
# Everything else in this repository reads this file: the reference
# implementation (coptic_hyphenation/reference.py) and, later, the generator of
# the TeX pattern file. Change the rules here, never in the generated output.
# SPEC.md explains each rule and why it exists.
#
# Version 0 was the set of rules this work started from. Version 1, in
# progress, rebuilds the onset list and adds the rules decided since.
#
# Terms used below:
#   letter  a character of the Coptic alphabet
#   mark    a combining mark (Unicode category Mn): jinkim U+0300, trema U+0308,
#           the overline U+FE26/U+0305, ...
#   unit    one letter plus the marks written after it: ⲛ̀ is one unit
# Comparisons ignore case: a capital behaves like its small letter.

[meta]
version = "1-draft"
dialect = "Bohairic"

[letters]
# A unit whose letter is one of these is a vowel. Every other letter is a
# consonant, including ϯ.
vowels = ["ⲁ", "ⲉ", "ⲏ", "ⲓ", "ⲟ", "ⲩ", "ⲱ"]
# Consonants that carry their own vowel (ϯ is "ti"), so a piece holding one is
# never a lone consonant (see [lone_consonants]).
carry_a_vowel = ["ϯ"]

[syllabic]
# Units that are a syllable by themselves. The jinkim (U+0300) marks one: on ⲙ
# and ⲛ a syllabic sonorant (ⲙ̀-ⲫⲣⲏϯ, ⲛ̀-ⲥⲏⲟⲩ), on ⲉ a vowel standing alone
# (ⲉ̀-ⲡϣⲱⲓ, ⲉ̀-ⲃⲟⲗ, ⲁϥ-ⲉ̀ⲙⲓ), on ϣ a consonant with the vowel before it
# (ⲁϥ-ϣ̀-ⲧⲉⲙ-ϫⲓⲙⲓ). ⲉ̀ and ϣ̀ added 2026-11-20, ⲓ̀ and ⲁ̀ 2026-11-22 (ⲁϥ-ⲓ̀ⲛⲓ,
# ⲡⲉϥ-ⲁ̀-ϣⲁⲓ, ⲁ̀-ⲛⲟⲕ). A break may fall on either side of one, even when that
# leaves one unit before the break. On any other letter the jinkim is a plain
# mark (decided 2026-11-22): ⲙⲱⲩ̀-ⲥⲏⲥ, ⲥ̀ⲛⲟⲩϯ. On an article, see [articles].
units = ["ⲙ̀", "ⲛ̀", "ⲉ̀", "ϣ̀", "ⲓ̀", "ⲁ̀"]

# Prefixes that detach when a word begins with one. Only the longest match
# counts, and no break from the onset rule falls inside it: ⲡⲉⲛ-ⲓⲱⲧ, never
# ⲡⲉ-ⲛⲓⲱⲧ. A break after a prefix may leave one unit before it (ϯ-ⲡⲁⲣ-ⲑⲉ-ⲛⲟⲥ).
# A prefix with "followed_by" detaches only when the units after it match, one
# slot per unit: a list of letters, or "consonant" or "vowel".
[[prefix]]
text = "ⲡⲓ"
meaning = "definite article, masculine singular"

[[prefix]]
text = "ϯ"
meaning = "definite article, feminine singular"

[[prefix]]
text = "ⲛⲓ"
meaning = "definite article, plural"

[[prefix]]
text = "ⲟⲩ"
meaning = "indefinite article, singular"

[[prefix]]
text = "ϩⲁⲛ"
meaning = "indefinite article, plural"

[[prefix]]
text = "ⲫⲏ"
meaning = "relative, masculine singular (he who)"

[[prefix]]
text = "ⲛⲏ"
meaning = "relative, plural (those who)"

[[prefix]]
text = "ⲉ"
meaning = "the preposition ⲉ written without its jinkim, before the article ⲡ or ⲫ"
followed_by = [["ⲡ", "ⲫ"], "consonant"]
why = """
ⲉⲡϣⲱⲓ is ⲉ + ⲡϣⲱⲓ, so it breaks ⲉ-ⲡϣⲱⲓ, as ⲉ̀ⲡϣⲱⲓ does through its jinkim
(decided 2026-11-20). Not before ⲧ or ⲑ: an unmarked ⲉⲧ- or ⲉⲑ- before a
consonant is nearly always the relative or ⲉⲑⲃⲉ (ⲉⲑⲛⲏⲟⲩ, ⲉⲧϣⲉ)."""

[[prefix]]
text = "ⲡⲉⲛ"
meaning = "possessive article, our (masculine)"

[[prefix]]
text = "ⲧⲉⲛ"
meaning = "possessive article, our (feminine)"

[[prefix]]
text = "ⲛⲉⲛ"
meaning = "possessive article, our (plural)"

# ⲙⲉⲧ, the prefix of abstract nouns, is a syllable of its own wherever it
# stands, before a consonant or a vowel (decided 2026-11-22): ⲉϯ-ⲙⲉⲧ-ⲣⲱⲙⲓ,
# ϯ-ⲙⲉⲧ-ⲟⲩⲣⲟ, ⲟⲩ-ⲙⲉⲧ-ⲁⲧ-ⲥⲃⲱ. It wins over the article rule: ⲛ̀-ϯ-ⲙⲉⲑ-ⲙⲏⲓ.
# Before a consonant it may be written ⲙⲉⲑ (ⲙⲉⲑⲙⲏⲓ, ⲙⲉⲑⲛⲟⲩϫ). "anywhere" means
# it detaches inside a word as well as at its start; "not_in" lists the words
# where the same letters are not the prefix, which break by syllable as before.
[[prefix]]
text = "ⲙⲉⲧ"
meaning = "prefix of abstract nouns (-ness, -hood)"
anywhere = true
not_in = [
    "ⲙⲉⲧⲁⲛⲟⲓ", "ⲙⲉⲧⲁⲛⲓ",                      # μετάνοια, μετανοεῖν
    "ⲙⲉⲧⲁⲗⲩⲙ", "ⲙⲉⲧⲁⲗⲏⲙ", "ⲙⲉⲧⲁⲗⲏⲯ",          # μετάλημψις
    "ⲙⲉⲧⲁⲗⲁⲃ", "ⲙⲉⲧⲁⲗⲁⲙ",                     # μεταλαμβάνω
    "ⲙⲉⲧⲁⲃⲟⲗ",                                # μεταβόλος
    "ⲙⲉⲧⲁⲗⲗ", "ⲙⲉⲧⲁⲗⲓⲟⲛ",                     # μέταλλον
    "ⲙⲉⲧⲁⲥⲭ", "ⲙⲉⲧⲟⲭ",                        # μετασχεῖν, μέτοχος
    "ⲙⲉⲧⲁⲥⲟⲩ",                                # μετὰ σοῦ
    "ⲏⲙⲉⲧⲉⲣ",                                 # ἡμέτερος
    "ⲙⲉⲧⲣⲓⲧ", "ⲙⲉⲧⲣⲟⲡ", "ⲙⲉⲧⲣⲟⲛ", "ⲥⲩⲙⲙⲉⲧⲣ",  # μετρητής, ἀμέτρητος, μητρόπολις, μέτρον
    "ⲙⲉⲧⲁⲃⲉⲏⲗ", "ⲇⲟⲙⲉⲧⲓ", "ⲉⲛⲉⲙⲉⲧⲓ",          # the names Mehetabel, Domitius, Anamim
]

[[prefix]]
text = "ⲙⲉⲑ"
meaning = "ⲙⲉⲧ written before a consonant"
anywhere = true
followed_by = ["consonant"]

# The possessive articles with a one-consonant possessor (your, his, her)
# before a consonant: the possessor goes with the article, wherever the article
# stands, and the onset rule makes no break inside it (decided 2026-11-22):
# ⲡⲉⲕ-ⲗⲁⲟⲥ, ⲙ̀-ⲡⲉⲥ-ⲃⲓⲟⲥ, ⲛ̀-ⲛⲉⲥ-ⲡⲩⲗⲏ. "only_after" means a break may fall after
# it but none is added before it: the same letters end the relative ⲉⲧⲉ- with
# a pronoun (ⲉⲧⲉϥ-ⲛⲁ-ⲑⲁ-ⲙⲓⲟϥ), where a break before ⲧ would be wrong.
[[prefix]]
text = "ⲡⲉⲕ"
meaning = "possessive article, your (masculine singular)"
anywhere = true
only_after = true
followed_by = ["consonant"]

[[prefix]]
text = "ⲡⲉϥ"
meaning = "possessive article, his"
anywhere = true
only_after = true
followed_by = ["consonant"]

[[prefix]]
text = "ⲡⲉⲥ"
meaning = "possessive article, her"
anywhere = true
only_after = true
followed_by = ["consonant"]
not_in = ["ⲝⲁⲡⲉⲥⲧ"]                           # ἐξαπέστειλε

[[prefix]]
text = "ⲧⲉⲕ"
meaning = "possessive article, your (feminine possessed)"
anywhere = true
only_after = true
followed_by = ["consonant"]

[[prefix]]
text = "ⲧⲉϥ"
meaning = "possessive article, his (feminine possessed)"
anywhere = true
only_after = true
followed_by = ["consonant"]

[[prefix]]
text = "ⲧⲉⲥ"
meaning = "possessive article, her (feminine possessed)"
anywhere = true
only_after = true
followed_by = ["consonant"]

[[prefix]]
text = "ⲛⲉⲕ"
meaning = "possessive article, your (plural possessed)"
anywhere = true
only_after = true
followed_by = ["consonant"]

[[prefix]]
text = "ⲛⲉϥ"
meaning = "possessive article, his (plural possessed)"
anywhere = true
only_after = true
followed_by = ["consonant"]

[[prefix]]
text = "ⲛⲉⲥ"
meaning = "possessive article, her (plural possessed)"
anywhere = true
only_after = true
followed_by = ["consonant"]
not_in = ["ⲁⲛⲉⲥⲧⲏ"]                           # ἀνέστη

# A conjugation base with the pronoun ⲕ or ⲥ at the start of a word, before a
# consonant: the pronoun stays with its base (decided 2026-11-22): ⲁⲕ-ⲗⲉⲥ,
# ⲁⲥ-ⲧⲱⲛⲥ, ⲉⲧⲁⲥ-ⲕⲏⲛ. Greek words that open with the same letters are listed in
# "not_in" and break as before.
[[prefix]]
text = "ⲁⲕ"
meaning = "past (perfect) base + you (masculine)"
followed_by = ["consonant"]

[[prefix]]
text = "ⲁⲥ"
meaning = "past (perfect) base + she"
followed_by = ["consonant"]
not_in = ["ⲁⲥⲧⲏⲣ", "ⲁⲥⲧⲉⲣ", "ⲁⲥⲧⲣ", "ⲁⲥⲕⲏⲧ", "ⲁⲥⲕⲟⲥ", "ⲁⲥⲡⲁⲍ", "ⲁⲥⲡⲁⲥ", "ⲁⲥⲕⲁⲗⲱⲛ"]  # ἀστήρ, ἄστρον, ἀσκητής, ἀσκός, ἀσπάζομαι, ἀσπασμός, Ἀσκάλων

[[prefix]]
text = "ⲉⲕ"
meaning = "circumstantial base + you (masculine)"
followed_by = ["consonant"]

[[prefix]]
text = "ⲉⲥ"
meaning = "circumstantial base + she"
followed_by = ["consonant"]
not_in = ["ⲉⲥⲡⲁⲣ", "ⲉⲥⲡⲉⲣ", "ⲉⲥⲧⲉⲫ", "ⲉⲥⲧⲓⲛ"]  # ἑσπέρα, ἐστεφάνωσας, ἐστιν

[[prefix]]
text = "ϣⲁⲕ"
meaning = "aorist base + you (masculine)"
followed_by = ["consonant"]

[[prefix]]
text = "ϣⲁⲥ"
meaning = "aorist base + she"
followed_by = ["consonant"]

[[prefix]]
text = "ⲛⲁⲕ"
meaning = "imperfect base, or the preposition ⲛⲁ=, + you (masculine)"
followed_by = ["consonant"]
not_in = ["ⲛⲁⲕⲗⲏⲣ"]                           # κλῆρος after ⲛⲁ

[[prefix]]
text = "ⲛⲁⲥ"
meaning = "imperfect base, or the preposition ⲛⲁ=, + she"
followed_by = ["consonant"]
not_in = ["ⲛⲁⲥⲕⲏⲧ", "ⲛⲁⲥⲕⲩⲧ"]                # ἀσκητής, Σκύθης after ⲛ

[[prefix]]
text = "ⲉⲧⲁⲕ"
meaning = "relative past base + you (masculine)"
followed_by = ["consonant"]

[[prefix]]
text = "ⲉⲧⲁⲥ"
meaning = "relative past base + she"
followed_by = ["consonant"]

# One-letter articles. When the consonants after a word-initial syllabic unit
# or prefix begin with one of these, they all go with the next syllable: the
# article stays with its noun (ⲙ̀-ⲫⲛⲟⲩϯ, ⲙ̀-ⲡϭⲟⲓⲥ, ⲉ̀-ⲡϣⲱⲓ), and the onset rule
# makes no break among them (ⲛ̀-ϯⲡⲁⲣ-ⲑⲉ-ⲛⲟⲥ). Decided 2026-11-20, ϯ included
# although it carries its own vowel.
#
# An article written with a jinkim carries its own vowel, so it is never left
# alone. A break may fall before it, never after it: it stays with its noun as
# the others do (decided 2026-11-22). ϫⲉⲙ-ⲡ̀ϣⲓⲛⲓ, ⲙ̀-ⲫ̀ⲣⲏϯ, and ⲡ̀ϭⲟⲓⲥ unbroken.
[articles]
letters = ["ⲡ", "ⲫ", "ⲧ", "ⲑ", "ϯ"]
with_jinkim = ["ⲡ̀", "ⲫ̀", "ⲧ̀", "ⲑ̀"]

# A consonant that is a morpheme by itself: how it is divided (D1). The names
# are Coptic SCRIPTORIUM's parts of speech. Articles are carried out by [articles]; a
# subject pronoun needs nothing, because a pair the onset list does not hold
# already splits after it (ⲁϥ-ⲧⲱⲛϥ). Decided 2026-11-20.
[lone_letters]
"article" = "with what follows"
"subject pronoun" = "with what precedes"

# Pairs of consonants that stay together. Where two or more consonants stand
# between two vowels, the next syllable takes the last two if they are listed
# here, otherwise only the last one: ⲡⲓ-ⲭⲣⲓ-ⲥⲧⲟⲥ, ⲁⲗ-ⲗⲏ-ⲗⲟⲩⲓⲁ. A consonant
# carrying a mark is never part of a listed pair.
#
# The list was started from nothing on 2026-11-20 and decided on 2026-11-22
# from where Coptic SCRIPTORIUM divides the morphemes (SPEC.md, section 4,
# R4): a pair is listed when at least three quarters of the words that hold
# it want it together. Status "pinned" marks a pair kept for a case in
# tests/cases.txt and not yet decided. A pair that is not listed is apart.

[[onsets]]
pairs = ["ⲡⲕ", "ⲡϫ", "ⲡϭ", "ⲡϩ", "ⲡϧ", "ⲡⲭ", "ⲡⲑ", "ⲫⲛ", "ⲫⲃ", "ⲫⲣ", "ⲧⲫ"]
status = "decided"
why = "The first letter is the article ⲡ, ⲫ or ⲧ, which goes with its noun (D1)."
cases = ["ⲙ̀-ⲫⲣⲏϯ", "ⲉⲣⲉ-ⲡϭⲟⲓⲥ", "ϩⲓ-ⲧⲉⲛ-ⲧⲫⲉ"]

[[onsets]]
pairs = [
    "ϯⲃ", "ϯⲅ", "ϯⲇ", "ϯⲕ", "ϯⲗ", "ϯⲙ", "ϯⲛ", "ϯⲡ", "ϯⲣ", "ϯⲥ",
    "ϯⲧ", "ϯⲫ", "ϯⲭ", "ϯⲯ", "ϯϣ", "ϯϧ", "ϯϩ", "ϯϫ", "ϯϭ",
]
status = "decided"
why = """
ϯ always goes with what follows: the article (decided 2026-11-20), and also
the pronoun ϯ- "I" and the verb ϯ "give", which a pattern cannot tell apart
from it; these only lose the break after ϯ (ⲉϯⲛⲁϣⲉ)."""
cases = ["ⲁⲩ-ϯϩⲟ", "ⲁϥ-ϯⲙⲁϯ", "ⲁⲩ-ϯⲧⲟⲧϥ"]

[[onsets]]
pairs = [
    "ⲑⲣ", "ⲥⲃ", "ⲥϧ", "ϣⲃ", "ϣⲗ", "ϣⲑ", "ϣⲧ", "ϣⲫ", "ϣϥ", "ϣϭ",
    "ϩⲃ", "ϩⲑ", "ϩⲕ", "ϩⲣ", "ϫⲫ", "ϭⲗ", "ϭⲣ", "ⲙⲑ",
]
status = "decided"
why = """
Native stems begin with these: the causative ⲑⲣⲉ-, ⲥⲃⲱ, ⲥϧⲁⲓ, ϣⲃⲱⲧ, ϣⲗⲏⲗ,
ϣⲑⲟⲣⲧⲉⲣ, the negative ϣⲧⲉⲙ-, ϣⲫⲏⲣ, ϣϥⲁⲓ, ϣϭⲟⲣ, ϩⲃⲏⲟⲩⲓ, ϩⲑⲟ, ϩⲕⲟ, ϩⲣⲁ=,
ϫⲫⲟ, ϭⲗⲟϫ, ϭⲣⲟ, ⲙⲑⲟ."""
cases = ["ⲉⲧⲁϥ-ⲑⲣⲉ", "ⲛⲉⲕ-ϣⲫⲏⲣ", "ⲁϥ-ⲥϧⲁⲓ", "ⲁϥ-ϫⲫⲉ", "ⲁⲩ-ϭⲣⲟ", "ⲧⲉ-ⲧⲉⲛ-ϣⲧⲉ-ⲙⲉⲣ-ⲥⲕⲁⲛ-ⲇⲁ-ⲗⲓ-ⲍⲉⲥⲑⲉ"]

[[onsets]]
pairs = ["ⲡⲣ", "ⲡⲗ", "ⲡⲛ", "ⲕⲗ", "ⲭⲣ", "ⲭⲗ", "ⲇⲣ", "ⲅⲛ", "ⲥⲡ"]
status = "decided"
why = """
A Greek word can begin with these (πρ, πλ, πν, κλ, χρ, χλ, δρ, γν, σπ), and
in Coptic they stand almost only inside Greek words."""
cases = ["ⲡⲓ-ⲡⲣⲟ-ⲫⲏ-ⲧⲏⲥ", "ⲡⲓ-ⲡⲛⲉⲩⲙⲁ", "ϯ-ⲉⲕ-ⲕⲗⲏ-ⲥⲓⲁ", "ⲡⲓ-ⲭⲣⲓ-ⲥⲧⲟⲥ", "ⲁⲛ-ⲇⲣⲉⲁⲥ"]

[[onsets]]
pairs = ["ⲥⲧ", "ⲥⲕ"]
status = "pinned"
why = """
These depend on the word: Greek words keep them together (ⲡⲓ-ⲭⲣⲓ-ⲥⲧⲟⲥ,
ⲥⲕⲁⲛ-ⲇⲁ-ⲗⲓ-ⲍⲉⲥⲑⲉ), native ones do not (ⲁⲓ-ⲙⲉⲥ-ⲧⲉ, the pronoun in ⲁⲥ-ⲧⲱⲛⲥ).
Kept together until rules that look at the word decide them."""
cases = ["ⲡⲓ-ⲭⲣⲓ-ⲥⲧⲟⲥ", "ⲧⲉ-ⲧⲉⲛ-ϣⲧⲉ-ⲙⲉⲣ-ⲥⲕⲁⲛ-ⲇⲁ-ⲗⲓ-ⲍⲉⲥⲑⲉ"]

# No piece between two breaks may be left without a vowel: a vowel, a
# syllabic unit, or a letter that carries one, ϯ or an article with a jinkim
# (decided 2026-11-20). When the other rules would leave consonants alone, a
# break is dropped: they join what follows when they come after a prefix or a
# syllabic unit, since that is the start of a stem (ⲡⲓ-ϣⲗⲟⲗ, ⲛ̀-ⲕⲣⲓ-ⲧⲏⲥ), and
# otherwise what precedes, since that is the end of a word part such as a
# pronoun (ⲡⲉϥ-ⲙ̀-ⲃⲟⲛ, ⲉⲣⲉ-ⲧⲉⲛ-ⲉ̀-ϣⲱⲧ). At the start or the end of a word they
# join the only side there is.
[lone_consonants]
allowed = false

[minimums]
# Counted in units, not code points: ⲛ̀ counts as one.
# Units before a break made by the onset rule.
before = 2
# Units before a break next to a syllabic unit or after a prefix.
before_syllable = 1
# Units after any break.
after = 3
